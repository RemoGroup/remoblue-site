<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1740" width="390" height="1740" role="img" aria-labelledby="mobile-title mobile-desc" data-layout="mobile">
<title id="mobile-title">RemoGM — Architecture direction</title><desc id="mobile-desc">Architecture direction. Company knowledge and industry expertise inform RemoGM. The owner sets goals, permissions and approvals and may pause work. RemoGM returns updates and decisions to the owner, and coordinates tasks and priorities across software, people and compatible humanoids. Each destination returns progress, results and requests for help to RemoGM. Humanoid integration is in development. Business-task coordination is separate from the robot’s sensing, movement and local controls. Availability depends on compatibility and task validation.</desc>
<defs>
 <pattern id="mobile-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#294563" stroke-opacity=".16" stroke-width=".7"/></pattern>
 <radialGradient id="mobile-glow"><stop stop-color="#3478ff" stop-opacity=".15"/><stop offset="1" stop-color="#3478ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="mobile-core" x2=".9" y2="1"><stop stop-color="#173966"/><stop offset="1" stop-color="#10233d"/></linearGradient>
 <marker id="mobile-task" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3478ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="mobile-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8ab4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
