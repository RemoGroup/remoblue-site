<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" width="1440" height="1040" role="img" aria-labelledby="desktop-title desktop-desc" data-layout="desktop">
<title id="desktop-title">RemoGM — Architecture direction</title><desc id="desktop-desc">Architecture direction. Company knowledge and industry expertise inform RemoGM. The owner sets goals, permissions and approvals and may pause work. RemoGM returns updates and decisions to the owner, and coordinates tasks and priorities across software, people and compatible humanoids. Each destination returns progress, results and requests for help to RemoGM. Humanoid integration is in development. Business-task coordination is separate from the robot’s sensing, movement and local controls. Availability depends on compatibility and task validation.</desc>
<defs>
 <pattern id="desktop-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3F3F46" stroke-opacity=".16" stroke-width=".7"/></pattern>
 <radialGradient id="desktop-glow"><stop stop-color="#D4AF37" stop-opacity=".15"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
 <linearGradient id="desktop-core" x2=".9" y2="1"><stop stop-color="#3A301A"/><stop offset="1" stop-color="#201D16"/></linearGradient>
 <marker id="desktop-task" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="desktop-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#F3E5AB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
